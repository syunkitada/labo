name: monitoring

services:
  monitoring-grafana:
    container_name: monitoring-grafana
    restart: always
    image: grafana/grafana:12.3
    # Configure: https://grafana.com/docs/grafana/latest/setup-grafana/configure-grafana/
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_PLUGINS_PREINSTALL=grafana-clock-panel
    volumes:
      - "grafana-data:/var/lib/grafana"
    ports:
      - "3000:3000"

  # S3 compatible object storage
  monitoring-rustfs:
    container_name: monitoring-rustfs
    restart: always
    image: rustfs/rustfs:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - RUSTFS_ADDRESS=0.0.0.0:9000
      - RUSTFS_CONSOLE_ADDRESS=0.0.0.0:9001
      - RUSTFS_ACCESS_KEY=admin
      - RUSTFS_SECRET_KEY=admin
      - RUSTFS_CONSOLE_ENABLE=true
    volumes:
      - rustfs-data:/data

  # ----------------------------------------------------------------------------------------------------
  # Metrics and alerting components
  # ----------------------------------------------------------------------------------------------------
  monitoring-prometheus-alertmanager:
    container_name: monitoring-prometheus-alertmanager
    restart: always
    image: prom/alertmanager:v0.31.1
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager/config.yml:/etc/alertmanager/config.yml

  monitoring-victoriametrics:
    container_name: monitoring-victoriametrics
    restart: always
    image: victoriametrics/victoria-metrics:v1.135.0
    depends_on:
      - "monitoring-prometheus-alertmanager"
    ports:
      - "9999:9999"
    volumes:
      - "victoriametrics-data:/storage"
    command:
      - "--storageDataPath=/storage"
      - "--httpListenAddr=:9999"

  # ----------------------------------------------------------------------------------------------------
  # Log components
  # ----------------------------------------------------------------------------------------------------
  monitoring-victoriametrics-vmagent:
    container_name: monitoring-victoriametrics-vmagent
    restart: always
    image: victoriametrics/vmagent:v1.135.0
    depends_on:
      - "monitoring-victoriametrics"
    ports:
      - "8429:8429"
    volumes:
      - "victoriametrics-vmagent-data:/vmagentdata"
      - "./victoriametrics/prometheus_scrape_config.yml:/etc/prometheus/scrape_config.yml"
    command:
      - "--promscrape.config=/etc/prometheus/scrape_config.yml"
      - "--remoteWrite.url=http://monitoring-victoriametrics:9999/api/v1/write"

  # Reference: https://hub.docker.com/r/apache/kafka
  # Ports Info:
  # - 9092: for external communication
  # - 29092: for internal communication
  # - 29093: for internal controller communication
  monitoring-kafka:
    container_name: monitoring-kafka
    restart: always
    image: apache/kafka:4.1.1
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://monitoring-kafka:29092,CONTROLLER://monitoring-kafka:29093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://monitoring-kafka:9092,PLAINTEXT_INTERNAL://monitoring-kafka:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@monitoring-kafka:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3

  # Reference: https://github.com/kafbat/kafka-ui/blob/main/.dev/dev.yaml
  monitoring-kafka-ui:
    container_name: monitoring-kafka-ui
    restart: always
    image: ghcr.io/kafbat/kafka-ui:v1.2.0
    ports:
      - "9090:8080"
    depends_on:
      - monitoring-kafka
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: monitoring-kafka:29092
      KAFKA_CLUSTERS_0_METRICS_PORT: 9997

  monitoring-kafka-init-topics:
    container_name: monitoring-kafka-init-topics
    restart: "no"
    image: apache/kafka:4.1.1
    depends_on:
      - monitoring-kafka
    command:
      - bash
      - -c
      - >
        echo Initializing Kafka topics... &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server monitoring-kafka:29092 --create --topic mylabo-logs || echo "Already created" &&
        echo Kafka topics created successfully.

  monitoring-grafana-loki:
    container_name: monitoring-grafana-loki
    image: grafana/loki:3.5.10
    ports:
      - "3100:3100"
    command: -config.file=/opt/grafana-loki/config.yaml
    volumes:
      - "grafana-loki-data:/loki"
      - "./grafana-loki/config.yaml:/opt/grafana-loki/config.yaml"

  monitoring-vector-aggregator:
    container_name: monitoring-vector-aggregator
    restart: always
    image: timberio/vector:0.53.0-debian
    depends_on:
      - monitoring-kafka
      - monitoring-grafana-loki
    ports:
      - "9599:9599"
    volumes:
      - ./vector/aggregator_vector.yml:/etc/vector/vector.yml
    command: ["--config", "/etc/vector/vector.yml"]

  # ----------------------------------------------------------------------------------------------------
  # Node components
  # ----------------------------------------------------------------------------------------------------
  monitoring-vector-agent:
    container_name: monitoring-vector-agent
    restart: always
    image: timberio/vector:0.53.0-debian
    depends_on:
      - monitoring-kafka
    ports:
      - "9598:9598"
    volumes:
      - ./vector/agent_vector.yml:/etc/vector/vector.yml
      - /var/log/journal:/var/log/journal:ro
    command: ["--config", "/etc/vector/vector.yml"]

  monitoring-prometheus-node-exporter:
    image: quay.io/prometheus/node-exporter:latest
    container_name: monitoring-prometheus-node-exporter
    command:
      - '--path.rootfs=/host'
    network_mode: host
    pid: host
    restart: always
    volumes:
      - '/:/host:ro,rslave'

volumes:
  grafana-data:
  grafana-loki-data:
  victoriametrics-data:
  victoriametrics-vmagent-data:
  rustfs-data:
