global:
  scrape_interval: 60s

scrape_configs:
  - job_name: "victoriametrics"
    static_configs:
      - targets:
          - "127.0.0.1:8428"
  - job_name: "victoriametrics-vmagent"
    static_configs:
      - targets:
          - "127.0.0.1:8429"
  - job_name: "victoriametrics-vmalert"
    static_configs:
      - targets:
          - "127.0.0.1:8880"
  - job_name: "vector-aggregator"
    static_configs:
      - targets:
          - "127.0.0.1:9599"
  - job_name: "vector-agent"
    static_configs:
      - targets:
          - "127.0.0.1:9598"
  - job_name: "prometheus-node-exporter"
    static_configs:
      - targets:
          - "127.0.0.1:9100"
