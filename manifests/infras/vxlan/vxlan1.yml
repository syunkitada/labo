imports:
  - /etc/ansible/host_vars/localhost.yaml

kind: Infra
name: vxlan1
template_map:
  node:
    kind: container
    spec:
      image: local/rocky9-nwnode:latest
      mtu: 1500
spec:
  ipam:
    network1:
      subnet: 10.10.1.0/24
      kind: l2
    network2:
      subnet: 10.10.2.0/24
      kind: l2
    network_vlan1:
      subnet: 10.100.1.0/24
      kind: l2

  nodes:
    - name: r1
      templates:
        - node
      spec:
        links:
          - peer: n1
            ips:
              - inet: <%=gateway_inet4("network1")%>
            peer_ips:
              - inet: <%=assign_inet4("network1")%>
          - peer: n2
            ips:
              - inet: <%=gateway_inet4("network2")%>
            peer_ips:
              - inet: <%=assign_inet4("network2")%>
    - name: n1
      templates:
        - node
      spec:
        routes:
          - dst: default
            via: <%=spec._node_map.n1.spec._links.0.ips.0.ip%>
        var_map:
          vlan_inet4: <%=assign_inet4("network_vlan1")%>
        cmds:
          - set +e
          - ip link add test-vxlan1 type vxlan id 100 remote <%=spec._node_map.n2.spec._links.0.peer_ips.0.ip%>
            dstport 4789 dev <%=spec._node_map.n1.spec._links.0.peer_name%>
          - ip address add <%=spec._node_map.n1.spec.var_map.vlan_inet4%> dev test-vxlan1
          - ip link set test-vxlan1 up
        tests:
          - kind: ping
            targets:
              - name: n2_under
                dst: <%=spec._node_map.n2.spec._links.0.peer_ips.0.ip%>
              - name: n2_over_vxlan
                dst: <%=inet_to_ip(spec._node_map.n2.spec.var_map.vlan_inet4)%>
    - name: n2
      templates:
        - node
      spec:
        routes:
          - dst: default
            via: <%=spec._node_map.n2.spec._links.0.ips.0.ip%>
        var_map:
          vlan_inet4: <%=assign_inet4("network_vlan1")%>
        cmds:
          - set +e
          - ip link add test-vxlan1 type vxlan id 100 remote <%=spec._node_map.n1.spec._links.0.peer_ips.0.ip%>
            dstport 4789 dev <%=spec._node_map.n2.spec._links.0.peer_name%>
          - ip address add <%=spec._node_map.n2.spec.var_map.vlan_inet4%> dev test-vxlan1
          - ip link set test-vxlan1 up
