imports:
  - /etc/ansible/host_vars/localhost.yaml

template_map:
  node:
    kind: container
    spec:
      image: local/rocky9-nwnode:latest
      mtu: 9000
      sysctl_map:
        net.ipv4.tcp_l3mdev_accept: 1
        net.ipv4.udp_l3mdev_accept: 1
        net.vrf.strict_mode: 1
        net.ipv6.conf.default.disable_ipv6: 0
        net.ipv6.conf.all.disable_ipv6: 0
        net.ipv6.conf.default.accept_ra: 0
        net.ipv6.conf.all.accept_ra: 0
        net.ipv4.conf.all.rp_filter: 0
        net.ipv4.conf.all.forwarding: 1
        net.ipv4.conf.default.forwarding: 1
        net.ipv6.conf.all.forwarding: 1
        net.ipv6.conf.default.forwarding: 1
        net.ipv6.conf.all.seg6_enabled: 1
        net.ipv6.conf.default.seg6_enabled: 1
  frr:
    spec:
      steps:
        - template:
            src: frr/daemons.j2
            dst: /etc/frr/daemons
        - template:
            src: frr/frr.conf.j2
            dst: /etc/frr/frr.conf
        - shell:
            cmds:
              - sed -i 's/StartLimitInterval=.*/StartLimitInterval=10s/' /usr/lib/systemd/system/frr.service
              - systemctl restart frr
  aggregator:
    spec:
      lo_ips:
        - inet: <%=assign_inet4("spine_network")%>
      vars:
        frr_bgp_asn: <%=ipv4_to_asn(_node.spec.lo_ips.0.ip)%>
        frr_bgp_router_id: <%=_node.spec.lo_ips.0.ip%>
        frr_bgp_peer_groups:
          - name: ADMIN
            asn: external
            capability: extended-nexthop
            activate_ipv4_unicast: true
            activate_ipv6_unicast: true
        frr_bgp_ipv4_unicast_networks:
          - <%=_node_map.CL1.spec.links.0.ips.0.network%>
          - <%=lo_ips.0.inet%>
        frr_bgp_ipv6_unicast_networks:
          - <%=_node_map.CL1.spec.links.0.ips.1.network%>
  spine:
    spec:
      lo_ips:
        - inet: <%=assign_inet4("spine_network")%>
      vars:
        frr_bgp_asn: <%=ipv4_to_asn(_node.spec.lo_ips.0.ip)%>
        frr_bgp_router_id: <%=_node.spec.lo_ips.0.ip%>
        frr_bgp_peer_groups:
          - name: ADMIN
            asn: external
            capability: extended-nexthop
            activate_ipv4_unicast: true
            activate_ipv6_unicast: true
        frr_bgp_ipv4_unicast_networks:
          - <%=_node.spec.lo_ips.0.inet%>
  leaf:
    spec:
      lo_ips:
        - inet: <%=assign_inet4("leaf_network")%>
      vars:
        frr_bgp_asn: <%=ipv4_to_asn(_node.spec.lo_ips.0.ip)%>
        frr_bgp_router_id: <%=_node.spec.lo_ips.0.ip%>
        frr_bgp_peer_groups:
          - name: ADMIN
            asn: external
            capability: extended-nexthop
            activate_ipv4_unicast: true
            activate_ipv6_unicast: true
        frr_bgp_ipv4_unicast_networks:
          - <%=_node.spec.lo_ips.0.inet%>
  rr:
    spec:
      lo_ips:
        - inet: <%=assign_inet4("hv_network")%>
        - inet: <%=asn_to_sid(_node.spec.vars.frr_bgp_asn)%>
      vars:
        frr_bgp_asn: <%=ipv4_to_asn(_node.spec.lo_ips.0.ip)%>
        frr_bgp_router_id: <%=_node.spec.lo_ips.0.ip%>
        frr_bgp_peer_groups:
          - name: ADMIN
            asn: external
            capability: extended-nexthop
            activate_ipv4_unicast: true
            activate_ipv6_unicast: true
          - name: RR
            asn: external
            capability: extended-nexthop
            ebgp_multihop: 254
            update_source: <%=_node.spec.lo_ips.1.ip%>
            activate_ipv4_vpn: true
            activate_ipv6_vpn: true
            neighbors:
              - <%=_node_map.HV1.spec.lo_ips.1.ip%>
              - <%=_node_map.HV2.spec.lo_ips.1.ip%>
        frr_bgp_ipv4_unicast_networks:
          - <%=_node.spec.lo_ips.0.inet%>
        frr_bgp_ipv6_unicast_networks:
          - <%=_node.spec.lo_ips.1.inet%>
  hv:
    spec:
      lo_ips:
        - inet: <%=assign_inet4("hv_network")%>
        - inet: <%=asn_to_sid(_node.spec.vars.frr_bgp_asn)%>
      vars:
        frr_segment_routing:
          srv6_locator_prefix: <%=_node.spec.lo_ips.1.network%>
        frr_bgp_asn: <%=ipv4_to_asn(_node.spec.lo_ips.0.ip)%>
        frr_bgp_vrfs:
          - name: vrf50
            rd: "65000:50"
            rt: "65000:50"
          - name: vrf51
            rd: "65000:51"
            rt: "65000:51"
        frr_bgp_router_id: <%=_node.spec.lo_ips.0.ip%>
        frr_bgp_peer_groups:
          - name: ADMIN
            asn: external
            capability: extended-nexthop
            activate_ipv4_unicast: true
            activate_ipv6_unicast: true
          - name: RR
            asn: external
            capability: extended-nexthop
            update_source: <%=_node.spec.lo_ips.1.ip%>
            neighbors:
              - <%=_node_map.RR1.spec.lo_ips.1.ip%>
            ebgp_multihop: 254
            activate_ipv4_vpn: true
            activate_ipv6_vpn: true
        frr_bgp_ipv4_unicast_networks:
          - <%=_node.spec.lo_ips.0.inet%>
        frr_bgp_ipv6_unicast_networks:
          - <%=_node.spec.lo_ips.1.inet%>
  vm:
    spec:
      mtu: 1500
      routes:
        - dst: default
          via: <%=gateway_ip(_node.spec._links.0.peer_ips.0.network)%>

kind: Infra
name: srv6vrf
spec:
  ipam:
    outer_network1:
      subnet: 10.10.0.0/24
      kind: l2
    spine_network:
      subnet: 10.10.1.0/24
      kind: l3
    leaf_network:
      subnet: 10.10.2.0/24
      kind: l3
    hv_network:
      subnet: 10.10.20.0/24
      kind: l3
    t1vm_network1:
      subnet: 10.100.0.0/24
      kind: l2
    t1vm_network2:
      subnet: 10.100.1.0/24
      kind: l2
    t2vm_network1:
      subnet: 10.100.0.0/24
      kind: l2
    t2vm_network2:
      subnet: 10.100.1.0/24
      kind: l2

  nodes:
    - name: CL1
      templates:
        - node
      spec:
        routes:
          - dst: default
            via: <%=_node.spec.links.0.peer_ips.0.ip%>
        links:
          - peer: AG1
            ips:
              - inet: <%=assign_inet4("outer_network1")%>
              - inet: <%=inet4_to_inet6(_node.spec.links.0.ips.0.inet)%>
            peer_ips:
              - inet: <%=gateway_inet4("outer_network1")%>
        tests:
          - shell:
              cmds:
                - ping -c 1 -W 1 <%=_node_map.SP1.spec.lo_ips.0.ip%>
                - ping -c 1 -W 1 <%=_node_map.SP2.spec.lo_ips.0.ip%>
                - ping -c 1 -W 1 <%=_node_map.L11.spec.lo_ips.0.ip%>
                - ping -c 1 -W 1 <%=_node_map.L12.spec.lo_ips.0.ip%>
                - ping -c 1 -W 1 <%=_node_map.L21.spec.lo_ips.0.ip%>
                - ping -c 1 -W 1 <%=_node_map.L22.spec.lo_ips.0.ip%>
                - ping -c 1 -W 1 <%=_node_map.RR1.spec.lo_ips.0.ip%>
                - ping -c 1 -W 1 <%=_node_map.HV1.spec.lo_ips.0.ip%>
                - ping -c 1 -W 1 <%=_node_map.HV2.spec.lo_ips.0.ip%>
    - name: AG1
      templates:
        - node
        - aggregator
        - frr
      spec:
        links:
          - peer: SP1
            bgp_peer_group: ADMIN
          - peer: SP2
            bgp_peer_group: ADMIN
    - name: SP1
      templates:
        - node
        - spine
        - frr
      spec:
        links:
          - peer: L11
            bgp_peer_group: ADMIN
          - peer: L12
            bgp_peer_group: ADMIN
          - peer: L21
            bgp_peer_group: ADMIN
          - peer: L22
            bgp_peer_group: ADMIN
    - name: SP2
      templates:
        - node
        - spine
        - frr
      spec:
        links:
          - peer: L11
            bgp_peer_group: ADMIN
          - peer: L12
            bgp_peer_group: ADMIN
          - peer: L21
            bgp_peer_group: ADMIN
          - peer: L22
            bgp_peer_group: ADMIN
    - name: L11
      templates:
        - node
        - leaf
        - frr
      spec:
        links:
          - peer: RR1
            bgp_peer_group: ADMIN
          - peer: HV1
            bgp_peer_group: ADMIN
    - name: L12
      templates:
        - node
        - leaf
        - frr
      spec:
        links:
          - peer: RR1
            bgp_peer_group: ADMIN
          - peer: HV1
            bgp_peer_group: ADMIN
    - name: L21
      templates:
        - node
        - leaf
        - frr
      spec:
        links:
          - peer: HV2
            bgp_peer_group: ADMIN
    - name: L22
      templates:
        - node
        - leaf
        - frr
      spec:
        links:
          - peer: HV2
            bgp_peer_group: ADMIN

    - name: RR1
      templates:
        - node
        - rr
        - frr
      spec:
        steps:
          - template:
              src: frr/daemons.j2
              dst: /etc/frr/daemons
          - template:
              src: frr/frr.conf.j2
              dst: /etc/frr/frr.conf
          - shell:
              cmds:
                - sed -i 's/StartLimitInterval=.*/StartLimitInterval=10s/' /usr/lib/systemd/system/frr.service
                - systemctl restart frr

    - name: HV1
      templates:
        - node
        - hv
      spec:
        links:
          - peer: t1vm1
            peer_ips:
              - inet: <%=assign_inet4("t1vm_network2")%>
          - peer: t2vm1
            peer_ips:
              - inet: <%=assign_inet4("t2vm_network2")%>
        steps:
          - template:
              src: frr/daemons.j2
              dst: /etc/frr/daemons
          - template:
              src: frr/frr.conf.j2
              dst: /etc/frr/frr.conf
          - shell:
              cmds:
                - sed -i 's/StartLimitInterval=.*/StartLimitInterval=10s/' /usr/lib/systemd/system/frr.service
                - systemctl restart frr
          - shell:
              cmds:
                - ip link add dev vrf50 type vrf table 50 | echo "ignored"
                - ip link set dev vrf50 up
                - ip link set dev HV1_0_t1vm1 master vrf50
                - ip route add 10.100.1.2 dev HV1_0_t1vm1 table 50 | echo "ignored"
                - ip addr add 10.100.1.1/24 dev HV1_0_t1vm1 | echo "ignored"
                - sysctl -w net.ipv4.conf.HV1_0_t1vm1.proxy_arp=1

          - shell:
              cmds:
                - ip link add dev vrf51 type vrf table 51 | echo "ignored"
                - ip link set dev vrf51 up
                - ip link set dev HV1_1_t2vm1 master vrf51
                - ip route add 10.100.1.2 dev HV1_1_t2vm1 table 51 | echo "ignored"
                - ip addr add 10.100.1.1/24 dev HV1_1_t2vm1 | echo "ignored"
                - sysctl -w net.ipv4.conf.HV1_1_t2vm1.proxy_arp=1

    - name: HV2
      templates:
        - node
        - hv
      spec:
        links:
          - peer: t1vm2
            peer_ips:
              - inet: <%=assign_inet4("t1vm_network2")%>
          - peer: t2vm2
            peer_ips:
              - inet: <%=assign_inet4("t2vm_network2")%>
        steps:
          - template:
              src: frr/daemons.j2
              dst: /etc/frr/daemons
          - template:
              src: frr/frr.conf.j2
              dst: /etc/frr/frr.conf
          - shell:
              cmds:
                - sed -i 's/StartLimitInterval=.*/StartLimitInterval=10s/' /usr/lib/systemd/system/frr.service
                - systemctl restart frr
          - shell:
              cmds:
                - ip link add dev vrf50 type vrf table 50 | echo "ignored"
                - ip link set dev vrf50 up
                - ip link set dev HV2_0_t1vm2 master vrf50
                - ip route add 10.100.1.3 dev HV2_0_t1vm2 table 50 | echo "ignored"
                - ip addr add 10.100.1.1/24 dev HV2_0_t1vm2 | echo "ignored"
                - sysctl -w net.ipv4.conf.HV2_0_t1vm2.proxy_arp=1

          - shell:
              cmds:
                - ip link add dev vrf51 type vrf table 51 | echo "ignored"
                - ip link set dev vrf51 up
                - ip link set dev HV2_1_t2vm2 master vrf51
                - ip route add 10.100.1.3 dev HV2_1_t2vm2 table 51 | echo "ignored"
                - ip addr add 10.100.1.1/24 dev HV2_1_t2vm2 | echo "ignored"
                - sysctl -w net.ipv4.conf.HV2_1_t2vm2.proxy_arp=1

    - name: t1vm1
      templates:
        - node
        - vm
      spec:
        tests:
          - shell:
              cmds:
                - ping -c 1 -W 1 <%=_node_map.t1vm2.spec._links.0.peer_ips.0.ip%>
    - name: t2vm1
      templates:
        - node
        - vm
      spec:
        tests:
          - shell:
              cmds:
                - ping -c 1 -W 1 <%=_node_map.t2vm2.spec._links.0.peer_ips.0.ip%>
    - name: t1vm2
      templates:
        - node
        - vm
    - name: t2vm2
      templates:
        - node
        - vm
