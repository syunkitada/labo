imports:
  - /etc/ansible/host_vars/localhost.yaml
  - infras/ovs/vxlan/vxlan5.yml

template_map:
  hv:
    spec:
      l3admin:
        ips:
          - inet: <%=assign_inet4("l3admin_network1")%>
      vars:
        ovs_admin_ip: <%=assign_ip4("ovsadmin_network1")%>
        frr_bgp_router_id: "<%=_node.spec.l3admin.ips.0.ip%>"
        frr_bgp_asn: "<%=ipv4_to_asn(_node.spec.l3admin.ips.0.ip)%>"
        frr_route_map:
          DENY-ANY-v4:
            policy: deny
            order: 5
            version: 4
            prefix_list:
              - seq 5 deny 0.0.0.0/0
          ADMIN-v4:
            policy: permit
            order: 5
            version: 4
            prefix_list:
              - seq 5 permit <%=_node.spec.l3admin.ips.0.network%> le 32
          VM-v4:
            policy: permit
            order: 5
            version: 4
            prefix_list:
              - seq 5 permit <%=_node.spec.vars.ovs_admin_ip%>/32 le 32
        frr_bgp_peer_groups:
          - name: ADMIN
            route_map_v4_ins: [DENY-ANY-v4]
            route_map_v4_outs: [ADMIN-v4]
          - name: VM
            route_map_v4_ins: [DENY-ANY-v4]
            route_map_v4_outs: [VM-v4]
        frr_bgp_ipv4_unicast_networks:
          - <%=_node.spec.l3admin.ips.0.inet%>
          - <%=_node.spec.vars.ovs_admin_ip%>/32
        ovs_external_bridge:
          name: br-ex
          local_ip: <%=_node.spec.vars.ovs_admin_ip%>
          interfaces:
            - name: <%=_node.spec._links.0.peer_name %>.200
              peer_mac: <%=_node.spec._links.0.link_mac %>
            - name: <%=_node.spec._links.1.peer_name %>.200
              peer_mac: <%=_node.spec._links.1.link_mac %>
      steps:
        - template:
            src: frr/daemons.j2
            dst: /etc/frr/daemons
        - template:
            src: frr/frr.conf.j2
            dst: /etc/frr/frr.conf
        - shell:
            cmds:
              - sed -i 's/StartLimitInterval=.*/StartLimitInterval=10s/' /usr/lib/systemd/system/frr.service
              - systemctl restart frr
        - template:
            src: ovs/ovs.sh.j2
            dst: /tmp/ovs.sh
        - template:
            src: ovs/br-ex.flows.j2
            dst: /tmp/br-ex.flows
        - shell:
            cmds:
              - /bin/bash -xe /tmp/ovs.sh

spec:
  ipam:
    eip_network1:
      subnet: 10.10.100.0/24
      kind: l3
    l3admin_network1:
      subnet: 10.10.10.0/24
      kind: l3
    ovsadmin_network1:
      subnet: 10.10.20.0/24
      kind: l3

spec_modifications:
  - overwrite_node:
      CL1:
        tests:
          - shell:
              cmds:
                # HV1-L3
                - ping -c 1 -W 1 <%=_node_map.HV1.spec.l3admin.ips.0.ip%>
                # HV1-L3-ovs
                - ping -c 1 -W 1 <%=_node_map.HV1.spec.vars.ovs_admin_ip.ip%>
                # HV2-L3
                - ping -c 1 -W 1 <%=_node_map.HV2.spec.l3admin.ips.0.ip%>
                # HV2-L3-ovs
                - ping -c 1 -W 1 <%=_node_map.HV2.spec.vars.ovs_admin_ip%>
